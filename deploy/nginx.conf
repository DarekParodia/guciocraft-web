# Zastąp guciocraft.example.com docelową domeną. Konfiguracja HTTP nadaje się
# za istniejącym terminatorem TLS; dla publicznego hosta dodaj HTTPS.
# Strefy limitów muszą znajdować się w kontekście http (np. conf.d).
limit_req_zone $binary_remote_addr zone=guciocraft_whitelist:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=guciocraft_status:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=guciocraft_downloads:1m;

server {
    listen 80;
    server_name guciocraft.example.com;
    client_max_body_size 512;
    client_body_timeout 5s;
    limit_req_status 429;

    # Jeśli przed Nginx stoi inne proxy, skonfiguruj real_ip_header oraz
    # set_real_ip_from WYŁĄCZNIE dla jego konkretnych zaufanych adresów.
    # Nie przepisuj surowego nagłówka IP od odwiedzającego.

    location = /api/whitelist {
        limit_req zone=guciocraft_whitelist burst=3 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /api/status {
        limit_req zone=guciocraft_status burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/downloads/ {
        limit_conn guciocraft_downloads 3;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
